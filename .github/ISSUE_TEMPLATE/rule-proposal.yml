name: Rule proposal
description: Propose a new React Router correctness or best-practice rule
title: "rule: "
labels: [rule-proposal]
body:
  - type: textarea
    id: rationale
    attributes:
      label: Runtime problem or best practice
      description: Explain the behavior and link to React Router documentation.
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Valid and invalid examples
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Exceptions and scope
      description: Describe legitimate patterns, fixability, and type-information needs.
